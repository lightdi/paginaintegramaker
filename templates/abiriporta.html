{% extends 'base.html' %}
{% block title %}Abrir Porta{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-warning">
                    <h3 class="text-white mb-0">Abrir Porta</h3>
                </div>
                <div class="card-body">
                    <form id="f">
                        <div class="mb-3">
                            <label class="form-label">Chave:</label>
                            <input type="password" class="form-control" id="ch" required>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" id="sv">
                            <label class="form-check-label" for="sv">Salvar chave</label>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Abrir Porta</button>
                    </form>
                    <div id="m" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const ch = localStorage.getItem('ch');
    if(ch) {
        document.getElementById('ch').value = ch;
        document.getElementById('sv').checked = true;
    }
});
document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const chave = document.getElementById('ch').value;
    const salvar = document.getElementById('sv').checked;
    if(salvar) localStorage.setItem('ch', chave);
    else localStorage.removeItem('ch');
    try {
        const r = await fetch('/abiriporta', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'chave=' + encodeURIComponent(chave)
        });
        const d = await r.json();
        const cls = r.ok ? 'alert-success' : 'alert-danger';
        document.getElementById('m').innerHTML = `<div class="alert ${cls}">${d.msg}</div>`;
    } catch(e) {
        document.getElementById('m').innerHTML = `<div class="alert alert-danger">Erro: ${e.message}</div>`;
    }
});
</script>
{% endblock %}
